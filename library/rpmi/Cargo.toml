[package]
name = "rpmi"
description = "RISC-V Platform Management Interface (RPMI) transport and message protocol"
version = "0.0.0"
authors = [
    "Zhouqi Jiang / Luo Jia <luojia@openatom.club>",
    "Killy Jack <zicai@openatom.club>",
]
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["riscv", "rpmi"]
categories = ["os", "embedded", "hardware-support", "no-std"]

[package.metadata.docs.rs]
default-target = "riscv64gc-unknown-none-elf"
targets = [
    "riscv32imac-unknown-none-elf", "riscv64imac-unknown-none-elf",
]

[dependencies]
log = "0.4"

[dev-dependencies]
memoffset = "0.9.1"
